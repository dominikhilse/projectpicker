<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dominik's Projects</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="page-header">
  <h1>Dominik's Projects</h1>
  <p class="subtitle">A launcher for side projects and demos.</p>
</header>

<main id="app">
  <p id="load-error" class="load-error" hidden>Couldn't load the project list — check manifest.json</p>
</main>

<div id="wip-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="wip-modal-title">
    <button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>
    <h2 id="wip-modal-title"></h2>
    <p id="wip-modal-summary"></p>
    <p id="wip-modal-note" class="modal-note"></p>
    <a id="wip-modal-link" class="btn btn-primary" target="_blank" rel="noopener">Open demo</a>
  </div>
</div>

<footer class="page-footer">
  <p>Driven by <code>manifest.json</code>. Edits may take a minute to show up here due to caching.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
